name: Hanamboatra APK Tantsaha Natif

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Maka ny kaody
        uses: actions/checkout@v4

      - name: Mametraka Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Hanangana ny Gradle wrapper mandeha ho azy
        run: |
          npm install -g corepack
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew

      - name: Mamorona debug.keystore mandeha ho azy
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Manamboatra APK
        run: ./gradlew assembleDebug

      - name: Mampakatra APK ho azo alaina
        uses: actions/upload-artifact@v4
        with:
          name: Tantsaha-Matihanina-APK
          path: "**/build/outputs/apk/debug/*.apk"
