name: Hanamboatra APK Tantsaha

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Maka ny kaody
        uses: actions/checkout@v4

      - name: Mametraka Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Hanangana ny Gradle wrapper mifanaraka amin'ny tetikasa
        run: |
          npm install -g corepack
          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew

      - name: Manamboatra APK
        run: ./gradlew assembleDebug

      - name: Mampakatra APK ho azo alaina
        uses: actions/upload-artifact@v4
        with:
          name: Tantsaha-Matihanina-APK
          path: "**/build/outputs/apk/debug/*.apk"
