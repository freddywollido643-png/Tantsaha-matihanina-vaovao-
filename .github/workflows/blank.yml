name: Hanamboatra APK Tantsaha

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Maka ny kaody
        uses: actions/checkout@v4

      - name: Mametraka Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Manome alalana ny Gradle
        run: chmod +x gradlew

      - name: Manamboatra APK
        run: ./gradlew assembleDebug

      - name: Mampakatra APK
        uses: actions/upload-artifact@v4
        with:
          name: Tantsaha-Matihanina-APK
          path: app/build/outputs/apk/debug/app-debug.apk
