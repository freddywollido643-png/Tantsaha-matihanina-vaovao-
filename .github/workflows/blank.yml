name: Hamorona APK avy amin'ny HTML

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Hakana ny kaody ao amin'ny GitHub
        uses: actions/checkout@v4

      - name: Mametraka Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Mametraka Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Hametraka ny Capacitor sy handika ny rakitra
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          mkdir -p www
          # Si vos fichiers HTML sont directement à la racine, on les copie dans www
          # en évitant d'inclure le dossier android s'il existe déjà
          rsync -av --exclude='android' --exclude='node_modules' --exclude='.git' ./ www/
          npx cap init "Tantsaha" "com.tantsaha.app" --web-dir=www
          npx cap add android || true
          npx cap sync android

      - name: Hanangana ny Gradle wrapper mandeha ho azy
        run: |
          npm install -g corepack
          cd android
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew

      - name: Mamorona debug.keystore mandeha ho azy
        run: |
          cd android
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Manamboatra APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Mampakatra APK ho azo alaina
        uses: actions/upload-artifact@v4
        with:
          name: Tantsaha-Matihanina-APK
          path: "android/app/build/outputs/apk/debug/*.apk"
