name: Hanamboatra APK Android

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Hakana ny code ao amin'ny Repository
        uses: actions/checkout@v4

      - name: Handefasana ny rafitra Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Hametrahana ny JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Mamorona ilay debug.keystore ho azy mba tsy hisy fahadisoana intsony
      - name: Hamoronana ny Debug Keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Hanamboarana ny APK (Compilation)
        run: gradle assembleDebug

      - name: Hampidinana ny APK vita (Upload Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: tantsaha-matihanina-apk
          path: app/build/outputs/apk/debug/app-debug.apk
