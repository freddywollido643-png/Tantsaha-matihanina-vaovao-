name: Hanamboatra APK Tantsaha Debug Internet

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Maka ny kaody
        uses: actions/checkout@v4

      - name: Mametraka Java 22
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'

      - name: Hamorona Manifest vaovao madio sy misy Internet
        run: |
          MANIFEST="app/src/main/AndroidManifest.xml"
          
          # Soloina rakitra madio sy tonga dia misy alàlana Internet ny Manifest
          cat << 'EOF' > $MANIFEST
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://android.com"
              xmlns:tools="http://android.com">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="true"
                  android:dataExtractionRules="@xml/data_extraction_rules"
                  android:fullBackupContent="@xml/backup_rules"
                  android:icon="@mipmap/ic_launcher"
                  android:label="Tantsaha"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.TantsahaMatihaninaVaovao"
                  android:usesCleartextTraffic="true"
                  tools:targetApi="31">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:theme="@style/Theme.TantsahaMatihaninaVaovao">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>

          </manifest>
          EOF
          echo "Manifest vaovao natsangana soa aman-tsara."

      - name: Hanangana ny Gradle wrapper mandeha ho azy
        run: |
          npm install -g corepack
          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew

      - name: Mamorona debug.keystore mandeha ho azy
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Manamboatra APK
        run: ./gradlew assembleDebug

      - name: Mampakatra APK ho azo alaina
        uses: actions/upload-artifact@v4
        with:
          name: Tantsaha-Matihanina-APK
          path: "**/build/outputs/apk/debug/*.apk"
