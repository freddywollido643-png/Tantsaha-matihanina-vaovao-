name: Hanamboatra APK Tantsaha Debug Internet

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Maka ny kaody
        uses: actions/checkout@v4

      - name: Mametraka Java 22
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'

      - name: Configurer le trafic réseau via Python (Sécurisé)
        run: |
          python3 -c "
          import xml.etree.ElementTree as ET
          import os

          manifest_path = 'app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest_path):
              # Enregistrement des namespaces pour éviter la corruption des préfixes android:
              ET.register_namespace('android', 'http://android.com')
              ET.register_namespace('tools', 'http://github.com')
              
              tree = ET.parse(manifest_path)
              root = tree.getroot()
              
              # Ajout des permissions Internet manquantes si absentes
              permissions = [
                  'android.permission.INTERNET',
                  'android.permission.ACCESS_NETWORK_STATE'
              ]
              for perm in permissions:
                  if not root.findall(f\".//uses-permission[@android:name='{perm}']\", {'android': 'http://android.com'}):
                      ET.SubElement(root, 'uses-permission', {
                          '{http://android.com}name': perm
                      })
              
              # Recherche de la balise application et injection du trafic en clair
              app_element = root.find('application')
              if app_element is not None:
                  app_element.set('{http://android.com}usesCleartextTraffic', 'true')
                  
              tree.write(manifest_path, encoding='utf-8', xml_declaration=True)
              print('AndroidManifest mis à jour avec succès.')
          "

      - name: Hanangana ny Gradle wrapper mandeha ho azy
        run: |
          npm install -g corepack
          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew

      - name: Mamorona debug.keystore mandeha ho azy
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Manamboatra APK
        run: ./gradlew assembleDebug

      - name: Mampakatra APK ho azo alaina
        uses: actions/upload-artifact@v4
        with:
          name: Tantsaha-Matihanina-APK
          path: "**/build/outputs/apk/debug/*.apk"
