name: Hanamboatra APK Tantsaha Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Maka ny kaody
        uses: actions/checkout@v4

      - name: Mametraka Java 22
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'

      - name: Hanangana ny Gradle wrapper mandeha ho azy
        run: |
          npm install -g corepack
          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew

      - name: Hanamboatra sonia ho an'ny APK Release
        run: |
          # Création d'une clé de signature officielle temporaire pour le mode Release
          keytool -genkey -v -keystore release.keystore -storepass tantsaha123 -alias tantsahakey -keypass tantsaha123 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Tantsaha,O=Matihanina,C=MG"
          
          # Injection automatique de la configuration de signature dans le projet
          cat << 'EOF' >> app/build.gradle.kts
          
          android {
              signingConfigs {
                  create("release") {
                      storeFile = file("../release.keystore")
                      storePassword = "tantsaha123"
                      keyAlias = "tantsahakey"
                      keyPassword = "tantsaha123"
                  }
              }
              buildTypes {
                  getByName("release") {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
          }
          EOF

      - name: Manamboatra APK Release
        run: ./gradlew assembleRelease

      - name: Mampakatra APK ho azo alaina
        uses: actions/upload-artifact@v4
        with:
          name: Tantsaha-Matihanina-Release-APK
          path: "**/build/outputs/apk/release/*.apk"
