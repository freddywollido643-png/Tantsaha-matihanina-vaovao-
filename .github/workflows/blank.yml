name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Récupérer le code source du projet
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Configurer l'environnement Java (Indispensable pour Android)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Donner les permissions d'exécution à Gradle
      - name: Make Gradle Executable
        run: chmod +x ./gradlew

      # 4. Compiler l'application pour générer l'APK de débogage
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 5. Sauvegarder et rendre l'APK disponible en téléchargement
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
