name: Hamorona APK avy amin'ny HTML

on:
  push:
    branches: [ "principal" ]
  pull_request:
    branches: [ "principal" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Hakana ny kaody ao amin'ny GitHub
        uses: actions/checkout@v4

      - name: Hamadika ny HTML ho APK
        uses: darkshredder/web-to-app-action@main
        with:
          # Raha ao amin'ny folder "www" na "build" ny HTML-nao dia soloy eto. 
          # Raha eny amin'ny fotony (root) kosa dia avelao "."
          build-folder-path: "." 
          app-name: "NyFampiasako"
          output-folder-path: "izay-apk"

      - name: Hampidina ilay rakitra APK voadika
        uses: actions/upload-artifact@v4
        with:
          name: Ny-App-APK-ko
          path: izay-apk/
