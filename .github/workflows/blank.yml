name: Générer APK Android

on:
  push:
    branches: [ "principal" ]
  pull_request:
    branches: [ "principal" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code du projet
        uses: actions/checkout@v4

      - name: Configurer Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Donner les permissions d'exécution à Gradle
        run: chmod +x gradlew

      - name: Compiler et générer l'APK Debug
        run: ./gradlew assembleDebug

      - name: Sauvegarder et rendre l'APK téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: Mon-Application-APK
          path: app/build/outputs/apk/debug/app-debug.apk
