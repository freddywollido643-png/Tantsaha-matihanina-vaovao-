name: Hanamboatra APK Tantsaha Debug Internet

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Maka ny kaody
        uses: actions/checkout@v4

      - name: Mametraka Java 22
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'

      - name: Configurer les permissions et le trafic réseau (Sed Sécurisé)
        run: |
          MANIFEST="app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            # 1. Ajoute l'attribut usesCleartextTraffic="true" proprement dans la balise <application>
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$MANIFEST"
            
            # 2. Ajoute les permissions Internet standards juste en dessous de la balise d'ouverture <manifest>
            sed -i 's|<manifest[^>]*>|&\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />|' "$MANIFEST"
            
            echo "AndroidManifest mis à jour avec succès."
          else
            echo "Erreur : Manifeste introuvable."
            exit 1
          fi

      - name: Hanangana ny Gradle wrapper mandeha ho azy
        run: |
          npm install -g corepack
          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew

      - name: Mamorona debug.keystore mandeha ho azy
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Manamboatra APK
        run: ./gradlew assembleDebug

      - name: Mampakatra APK ho azo alaina
        uses: actions/upload-artifact@v4
        with:
          name: Tantsaha-Matihanina-APK
          path: "**/build/outputs/apk/debug/*.apk"
