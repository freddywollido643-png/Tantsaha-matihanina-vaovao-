workflows:
  android-native-build:
    name: Hanamboatra APK Tantsaha amin ny Codemagic
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      groups:
        - sandbox
      vars:
        PACKAGE_NAME: "com.example.tantsaha"
      java: 22
    scripts:
      - name: Hanangana ny Gradle wrapper mandeha ho azy
        script: |
          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew
      - name: Mamorona debug.keystore ho an ny sonia
        script: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Manamboatra ny APK (Debug miaraka amin ny Internet)
        script: |
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
    publishing:
      email:
        recipients:
          - freddywollido643@gmail.com
